<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>晒场开屏 · 方案C — 轮转圆盘</title>
<style>
/* 方案 C（参考：橙色 volvelle 圆盘）——大圆盘匀速旋转，楔形窗口轮播档案，减速后定版出标题 */
:root{
  --paper:#EFE8DA; --rust:#C4501F; --ink:#3B3833;
  --font-en:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --font-cn:"方正兰亭黑","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--paper);cursor:pointer;font-family:var(--font-cn)}
#stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
/* 大圆盘 */
#disc{position:relative;width:min(78vh,78vw);height:min(78vh,78vw);border-radius:50%;
  background:var(--rust);box-shadow:0 18px 60px rgba(60,30,15,.28), inset 0 0 0 1px rgba(0,0,0,.08);
  will-change:transform}
#disc::after{content:'';position:absolute;left:50%;top:50%;width:5.5%;height:5.5%;transform:translate(-50%,-50%);
  border-radius:50%;background:var(--paper);box-shadow:inset 0 0 0 2px var(--ink)}
/* 楔形窗口：纸色三角挖窗，内部轮播案例 */
#wedge{position:absolute;left:50%;top:50%;width:46%;height:15%;transform-origin:0 50%;
  transform:rotate(0deg);z-index:2}
#wedge .shape{position:absolute;inset:0;background:var(--paper);
  clip-path:polygon(0 18%,100% 0,100% 100%,0 82%);box-shadow:0 4px 14px rgba(60,30,15,.2);
  display:flex;align-items:center;overflow:hidden}
#wedge img{height:82%;margin-left:6%;filter:drop-shadow(2px 3px 3px rgba(0,0,0,.25))}
#wedge .t{margin-left:7%;font-size:clamp(10px,1.15vw,15px);font-weight:700;color:var(--ink);
  letter-spacing:.06em;white-space:nowrap}
#wedge .n{font-family:var(--font-en);font-weight:400;font-size:.78em;color:var(--rust);margin-right:.6em}
/* 盘沿刻度字 */
.ringtxt{position:absolute;left:50%;top:50%;font-family:var(--font-en);font-size:9px;
  letter-spacing:.3em;color:rgba(239,232,218,.75);transform-origin:0 0}
/* 定版标题：倾斜投影形态 */
#title{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;
  opacity:0;transition:opacity .9s ease .15s;pointer-events:none;z-index:5}
#title.in{opacity:1}
#title .cn{font-weight:700;font-size:min(13vw,150px);color:var(--paper);letter-spacing:.04em;line-height:1;
  transform:skewY(-6deg) rotate(-3deg);text-shadow:5px 8px 0 rgba(60,30,15,.35)}
#title .en{font-family:var(--font-en);font-size:11px;letter-spacing:.62em;color:var(--paper);margin-top:16px;opacity:.9}
#cap{position:absolute;left:3%;top:4%;font-family:var(--font-en);font-size:9.5px;letter-spacing:.34em;color:var(--ink);opacity:.65}
#hint{position:absolute;left:50%;bottom:5%;transform:translateX(-50%);font-size:10px;letter-spacing:.5em;
  color:var(--ink);opacity:0;transition:opacity .8s;animation:blink 2.2s infinite}
#hint.in{opacity:.7}
@keyframes blink{50%{opacity:.25}}
body.out{transition:opacity .7s;opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="cap">SUN FIELD ARCHIVE — VOLVELLE</div>
<div id="stage">
  <div id="disc"></div>
  <div id="wedge"><div class="shape"><img id="wimg" alt=""><span class="t"><span class="n" id="wnum"></span><span id="wt"></span></span></div></div>
  <div id="title"><div class="cn">晒场</div><div class="en">SUN&nbsp;FIELD</div></div>
</div>
<div id="hint">点 按 进 入</div>
<script>
const ASSET='../assets/tint/';
const REEL=[['场-01','农民的婚礼'],['物-05','谷与物'],['人-09','劳作的人'],['场-07','收干草'],
  ['物-14','私人旧物'],['人-01','场边身影'],['场-12','打谷场'],['物-20','织物晾晒']];
const disc=document.getElementById('disc');
/* 盘沿刻度文字 */
for(let i=0;i<24;i++){
  const s=document.createElement('span');s.className='ringtxt';
  s.textContent=String(i+1).padStart(2,'0');
  s.style.transform='rotate('+(i*15)+'deg) translateY(-46%) translateX(-.5em)';
  s.style.transform='rotate('+(i*15)+'deg) translate(0,0)';
  const r=disc.offsetWidth/2*0.94;
  s.style.transform='rotate('+(i*15)+'deg) translateY(-'+r.toFixed(0)+'px)';
  disc.appendChild(s);
}
let ang=0, speed=0.9, step=0, settling=false;
const wimg=document.getElementById('wimg'), wt=document.getElementById('wt'), wnum=document.getElementById('wnum');
function setReel(i){ wimg.src=ASSET+REEL[i][0]+'.webp'; wt.textContent=REEL[i][1]; wnum.textContent=String(i+1).padStart(2,'0')+' /'; }
setReel(0);
let lastSwap=0;
function tick(t){
  ang=(ang+speed)%360;
  disc.style.transform='rotate('+ang+'deg)';
  if(!settling&&t-lastSwap>620){ lastSwap=t; step=(step+1)%REEL.length; setReel(step); }
  if(settling&&speed>0){ speed*=0.985; if(speed<0.02){ speed=0; settle(); } }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
setTimeout(()=>{ settling=true; },4200);
let done=false;
function settle(){
  if(done) return; done=true;
  /* 圆盘停稳：楔形窗收拢，标题以投影形态浮出 */
  document.getElementById('wedge').style.transition='opacity .5s';
  document.getElementById('wedge').style.opacity='0';
  document.getElementById('title').classList.add('in');
  setTimeout(()=>document.getElementById('hint').classList.add('in'),900);
}
document.body.addEventListener('click',()=>{
  if(!done){ settling=true; return; }
  document.body.classList.add('out');
  setTimeout(()=>{ location.href='../index.html'; },750);
});
</script>
</body>
</html>
