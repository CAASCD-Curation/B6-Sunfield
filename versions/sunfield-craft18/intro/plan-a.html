<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>晒场开屏 · 方案A — 锈蚀红拼贴年鉴</title>
<style>
/* 方案 A（参考：兔年年鉴海报）——单色锈蚀红文物拼贴 + 右幅大标题 wipe */
:root{
  --paper:#EFE8DA; --rust:#A8502B; --rust-d:#7E3A1E;
  --font-en:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --font-cn:"方正兰亭黑","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--paper);cursor:pointer;font-family:var(--font-cn)}
/* 拼贴区：左 58% */
#collage{position:absolute;left:0;top:0;width:58%;height:100%}
#collage img{position:absolute;opacity:0;transform:translateY(18px) rotate(var(--r)) scale(.92);
  filter:grayscale(1) sepia(1) hue-rotate(-16deg) saturate(2.6) contrast(1.06) brightness(.96);
  transition:opacity .8s cubic-bezier(.16,1,.3,1),transform .8s cubic-bezier(.16,1,.3,1)}
#collage img.in{opacity:.94;transform:translateY(0) rotate(var(--r)) scale(1)}
/* 右幅：锈蚀红大标题板，wipe 进入 */
#panel{position:absolute;right:0;top:0;width:42%;height:100%;background:var(--rust);
  clip-path:inset(0 0 0 100%);transition:clip-path 1s cubic-bezier(.7,0,.2,1)}
#panel.in{clip-path:inset(0 0 0 0)}
#panel .mid{position:absolute;left:9%;top:50%;transform:translateY(-50%)}
#panel .cn{font-weight:700;font-size:min(9vw,120px);color:var(--paper);letter-spacing:.06em;line-height:1.04;
  transform:skewY(-4deg)}
#panel .en{font-family:var(--font-en);font-size:13px;letter-spacing:.58em;color:var(--paper);opacity:.85;margin-top:22px}
#panel .meta{position:absolute;left:9%;bottom:6%;font-family:var(--font-en);font-size:9px;
  letter-spacing:.3em;color:var(--paper);opacity:.6;line-height:2.1}
/* 顶部小字 */
#cap{position:absolute;left:2.2%;top:3%;z-index:5;font-family:var(--font-en);font-size:9.5px;
  letter-spacing:.34em;color:var(--rust-d)}
#cap b{display:block;font-family:var(--font-cn);font-size:12px;letter-spacing:.4em;margin-top:6px;font-weight:400}
#hint{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);font-size:10px;
  letter-spacing:.5em;color:var(--rust-d);opacity:0;transition:opacity .8s;animation:blink 2.2s infinite}
#hint.in{opacity:.75}
@keyframes blink{50%{opacity:.25}}
body.out{transition:opacity .7s;opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="cap">SUN FIELD ARCHIVE — 130 ENTRIES<b>晒场 · 数字档案</b></div>
<div id="collage"></div>
<div id="panel">
  <div class="mid">
    <div class="cn">晒场</div>
    <div class="en">SUN&nbsp;FIELD</div>
  </div>
  <div class="meta">A LIVING ARCHIVE OF DRYING GROUNDS<br>场 FIELD · 物 OBJECT · 人 PEOPLE</div>
</div>
<div id="hint">点 按 进 入</div>
<script>
const ASSET='../assets/tint/';
const IMGS=['场-01','场-07','场-13','物-01','物-05','物-09','物-14','物-20','人-01','人-05','人-09','人-13','人-17','人-24'];
const col=document.getElementById('collage');
/* 错落网格定位（手工调过的“随意但舒服”布局，按容器百分比） */
const SPOTS=[
  [3,8,15],[24,9,11],[38,9,9],[12,26,13],[30,24,17],[48,22,10],
  [4,48,12],[24,46,15],[44,44,12],[7,68,16],[28,66,11],[46,62,14],[16,84,12],[38,82,13]];
SPOTS.forEach((s,i)=>{
  const im=new Image();
  im.src=ASSET+IMGS[i%IMGS.length]+'.webp';
  im.style.left=s[0]+'%'; im.style.top=s[1]+'%'; im.style.width=s[2]+'%';
  im.style.setProperty('--r',((i*53)%13-6)+'deg');
  col.appendChild(im);
  setTimeout(()=>im.classList.add('in'), 240+i*140);
});
setTimeout(()=>document.getElementById('panel').classList.add('in'), 240+SPOTS.length*140+500);
setTimeout(()=>document.getElementById('hint').classList.add('in'), 3200);
document.body.addEventListener('click',()=>{
  document.body.classList.add('out');
  setTimeout(()=>{ location.href='../index.html'; },750);
});
</script>
</body>
</html>
